<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Partex Drug Asset Intelligence Copilot</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e37;
    --text: #e8e9ec;
    --muted: #9aa1ac;
    --accent: #4f8cff;
    --ok: #2fbf71;
    --warn: #d9a441;
    --err: #e05d5d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 40px 20px;
  }
  .container { width: 100%; max-width: 720px; }
  h1 { font-size: 1.6rem; margin-bottom: 4px; }
  .subtitle { color: var(--muted); margin-bottom: 28px; font-size: 0.95rem; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
  }
  label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; margin-top: 16px; }
  label:first-child { margin-top: 0; }
  input[type="text"], textarea {
    width: 100%;
    background: #0f1115;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 10px 12px;
    font-size: 0.95rem;
    font-family: inherit;
    resize: vertical;
  }
  input[type="text"]:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
  }
  button {
    margin-top: 20px;
    width: 100%;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  #status { margin-top: 20px; font-size: 0.9rem; }
  .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 0.8rem; font-weight: 600; }
  .badge.ok { background: rgba(47,191,113,0.15); color: var(--ok); }
  .badge.warn { background: rgba(217,164,65,0.15); color: var(--warn); }
  .error-text { color: var(--err); }
  #report {
    margin-top: 20px;
    background: #0f1115;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    line-height: 1.6;
    display: none;
  }
  #report h1, #report h2 { color: var(--accent); }
  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 8px;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="container">
    <h1>Partex Drug Asset Intelligence Copilot</h1>
    <p class="subtitle">Profiling &middot; Risk scoring &middot; Hypothesis generation &middot; Competitive intelligence &mdash; grounded and critic-reviewed.</p>

    <div class="panel">
      <label for="compound">Compound or target</label>
      <input type="text" id="compound" placeholder="e.g. imatinib, metformin, KRAS" />

      <label for="question">What do you want to know?</label>
      <textarea id="question" rows="3">Summarize the risk and opportunity profile of this compound.</textarea>

      <button id="runBtn">Run analysis</button>

      <div id="status"></div>
      <div id="report"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
